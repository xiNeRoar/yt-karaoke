# Example Nginx Reverse Proxy configuration (e.g. Synology / QNAP / Docker Nginx)
# Replace:
#   - karaoke.yourdomain.com -> your public HTTPS domain
#   - YOUR_GPU_PC_LAN_IP     -> your GPU PC's static LAN IP (e.g. 192.168.1.11)

# Add inside http { ... } block:
# limit_req_zone $binary_remote_addr zone=karaoke_api:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=karaoke_sep:10m rate=2r/m;

server {
    listen 443 ssl http2;
    server_name karaoke.yourdomain.com;

    # SSL certificates (Let's Encrypt / Cloudflare Origin Cert)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # 1. STRICTLY BLOCK ALL ADMIN ENDPOINTS FROM THE PUBLIC INTERNET!
    #    Admin controls stay 100% local to your Desktop Tray Controller EXE.
    location ^~ /api/admin/ {
        return 403;
    }
    location = /api/settings {
        return 403;
    }

    # 2. Block DELETE on /api/cache from public internet (GET /api/cache allowed)
    location ^~ /api/cache {
        if ($request_method != GET) {
            return 403;
        }
        proxy_pass http://YOUR_GPU_PC_LAN_IP:18765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Separation & Lyrics endpoints (strict rate limiting to protect GPU)
    location = /api/separate {
        limit_req zone=karaoke_sep burst=3 nodelay;
        proxy_pass http://YOUR_GPU_PC_LAN_IP:18765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 4. Audio stem streaming (disable buffering so MP3 playback starts immediately)
    location ^~ /api/audio/ {
        proxy_pass http://YOUR_GPU_PC_LAN_IP:18765;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Status, Health, Heartbeat, Lyrics
    location /api/ {
        limit_req zone=karaoke_api burst=20 nodelay;
        proxy_pass http://YOUR_GPU_PC_LAN_IP:18765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
