<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <title>唱K 去人聲</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: #0f0f0f;
      color: #f1f1f1;
      font-family: "Roboto", "Segoe UI", "Noto Sans TC", sans-serif;
      font-size: 13px;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.1px;
    }
    .pill {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #aaaaaa;
    }
    .pill.online {
      background: rgba(43, 166, 64, 0.18);
      color: #4ade80;
    }
    .pill.warn {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .card-title {
      font-size: 11.5px;
      color: #aaaaaa;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .song-list {
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .song-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 12px;
      text-decoration: none;
      color: #f1f1f1;
      transition: background 0.15s ease;
    }
    .song-item:hover {
      background: rgba(255, 255, 255, 0.11);
    }
    .song-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .hint {
      font-size: 11.5px;
      color: #888888;
      line-height: 1.5;
    }
    .auth-box {
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .auth-box.visible {
      display: flex;
    }
    .auth-input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #101010;
      color: #f1f1f1;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      outline: none;
    }
    .auth-input:focus {
      border-color: #f1f1f1;
    }
    .auth-btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #f1f1f1;
      color: #0f0f0f;
    }
    .auth-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .auth-err {
      font-size: 11.5px;
      color: #f87171;
      min-height: 16px;
    }
    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }
    .link-btn {
      border: none;
      background: transparent;
      color: #888888;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
    }
    .link-btn:hover {
      color: #f1f1f1;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/><path d="M8 22h8"/></svg>
      <span>唱K 去人聲</span>
    </div>
    <div id="status-pill" class="pill">連線中</div>
  </div>

  <div id="auth-card" class="card auth-box">
    <div class="card-title">邀請碼驗證 · 只需輸入一次</div>
    <input id="invite-input" class="auth-input" type="text" placeholder="KTV-XXXX-XXXX" autocomplete="off" spellcheck="false" />
    <button id="invite-btn" class="auth-btn" type="button">啟用唱K 服務</button>
    <div id="invite-err" class="auth-err"></div>
  </div>

  <div id="songs-card" class="card">
    <div class="card-title">最近唱過（<span id="song-count">0 首</span>・點擊即開秒唱）</div>
    <div id="song-list" class="song-list"></div>
    <div class="footer-row">
      <p class="hint">打開 YouTube MV 即可開唱</p>
      <button id="switch-code-btn" class="link-btn" type="button" style="display:none;">更換邀請碼</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
