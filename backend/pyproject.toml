[project]
name = "yt-karaoke-backend"
version = "0.1.0"
description = "Local GPU AI vocal separation backend for YouTube Karaoke Chrome Extension"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "yt-dlp>=2025.1.15",
    "audio-separator>=0.28.0",
    "onnxruntime>=1.19.0",
    "torch>=2.7.0",
    "torchaudio>=2.7.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
